server:
  port: 8085

spring:
  application:
    name: ticket-service

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:27017/tickets_db

  data:
    mongodb:
      auto-index-creation: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A failing message is retried a few times (e.g. a seat whose cancellation hasn't arrived yet),
        # then rejected without requeue -> ends up in ticket-service.dead-letter
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2
          max-interval: 20s

app:
  rabbitmq:
    exchange: bioflix.events
    dead-letter-exchange: bioflix.events.dlx

management:
  endpoints:
    web:
      exposure:
        include: health,info
