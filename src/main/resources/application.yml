server:
  port: 8085

spring:
  application:
    name: ticket-service

  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:27017/tickets_db

  data:
    mongodb:
      auto-index-creation: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple   # OutboxRelay waits for the broker to confirm before marking an event published
    listener:
      simple:
        # A failing message is retried a few times, then rejected without requeue
        # -> ends up in ticket-service.dead-letter
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2
          max-interval: 20s

app:
  rabbitmq:
    exchange: cinema.events
    dead-letter-exchange: cinema.events.dlx
  outbox:
    poll-interval: 1s
    batch-size: 50
  ticket:
    # Signs the QR tokens. Set TICKET_QR_SECRET (at least 32 characters) outside local development.
    qr-secret: ${TICKET_QR_SECRET:local-dev-only-secret-change-me-0123456789}

management:
  endpoints:
    web:
      exposure:
        include: health,info
